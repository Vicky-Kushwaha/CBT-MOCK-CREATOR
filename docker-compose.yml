name: cbt-mock

# One command starts everything with hot reload:
#   docker compose up --build
x-backend: &backend
  build:
    context: ./backend
  env_file: .env
  volumes:
    - ./backend:/app            # source is bind-mounted -> code changes reload
    - media_data:/app/media     # uploads shared by backend + celery

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cbt}
      POSTGRES_USER: ${POSTGRES_USER:-cbt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cbt}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cbt} -d ${POSTGRES_DB:-cbt}"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Django + DRF (runserver auto-reloads on file change)
  backend:
    <<: *backend
    command: sh entrypoint.sh
    ports:
      - "8000:8000"
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/')"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  # Celery worker (restarts automatically when Python files change)
  celery:
    <<: *backend
    command: watchfiles --filter python "celery -A config worker -l info" apps config
    depends_on:
      backend: { condition: service_healthy }

  # MCP server for Claude (restarts automatically when Python files change)
  mcp:
    <<: *backend
    command: watchfiles --filter python "python -m mcp_server.server" apps config mcp_server
    ports:
      - "8811:8811"
    depends_on:
      backend: { condition: service_healthy }

  # React + Vite dev server with HMR
  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_PROXY: http://backend:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
  media_data:
  frontend_node_modules:
